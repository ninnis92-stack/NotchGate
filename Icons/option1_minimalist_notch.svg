<?xml version="1.0" encoding="UTF-8"?>
<!-- Option 1: Minimalist Notch Silhouette with Teal Accent -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Transparent (Apple requires transparency) -->
  <rect width="1024" height="1024" fill="none"/>
  
  <!-- Notch Shape: Black rounded rectangle -->
  <rect x="256" y="384" width="512" height="256" rx="128" fill="#000000"/>
  
  <!-- Teal Accent Line: Thin colored line across notch -->
  <line x1="320" y1="512" x2="704" y2="512" stroke="#008080" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Subtle Clock Symbol: Small circle in center of notch -->
  <circle cx="512" cy="512" r="64" fill="none" stroke="#008080" stroke-width="8"/>
  <line x1="512" y1="512" x2="540" y2="484" stroke="#008080" stroke-width="8" stroke-linecap="round"/>
</svg>