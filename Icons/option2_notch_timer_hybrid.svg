<?xml version="1.0" encoding="UTF-8"?>
<!-- Option 2: Notch + Timer Hybrid (Circular Clock Inside Notch) -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Transparent -->
  <rect width="1024" height="1024" fill="none"/>
  
  <!-- Notch Shape: Dark gray rounded rectangle -->
  <rect x="256" y="384" width="512" height="256" rx="128" fill="#1C1C1E"/>
  
  <!-- Circular Clock Face: White with orange accent ring -->
  <circle cx="512" cy="512" r="128" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="144" fill="none" stroke="#FF9500" stroke-width="16"/>
  
  <!-- Clock Hands: Black -->
  <line x1="512" y1="512" x2="512" y2="368" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
  <line x1="512" y1="512" x2="656" y2="512" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Small Tick Marks: 12, 3, 6, 9 -->
  <line x1="512" y1="352" x2="512" y2="384" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  <line x1="656" y1="512" x2="688" y2="512" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  <line x1="512" y1="656" x2="512" y2="688" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  <line x1="368" y1="512" x2="400" y2="512" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
</svg>