  <path
    d="M 512 512 L 700 512"
    fill="none"
    stroke="#F5F5F7"
    stroke-width="118"
    stroke-linecap="round"/>
  <!-- Teal latch through the gate opening. -->
  <path
    d="M 560 512 L 868 512"
    fill="none"
    stroke="#008080"
    stroke-width="56"
    stroke-linecap="round"/>
</svg>
